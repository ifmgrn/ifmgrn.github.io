assert_lefthook_installed: true
# For glob list support
min_version: 1.10.10

templates:
  exec: pnpm -s exec
  run: pnpm -s run

pre-commit:
  piped: true
  jobs:
    - name: formatting and linting
      run: "{run} format --colors=off {staged_files}"
      stage_fixed: true

    - name: type checking
      # Type checking always needs to happen on the entire project
      run: "{run} check"
      glob:
        - "*.{ts,js,svelte}"
        - "pnpm-lock.yaml"
        - "tsconfig.json"